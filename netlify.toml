[build]
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  # Fixes "Cannot find module '@supabase/supabase-js'" in mcp-server.mjs —
  # it's required indirectly (via importing ava-chat.js as a dependency),
  # which esbuild's static bundler doesn't correctly trace and inline.
  # This tells it to copy the module into the bundle as-is instead.
  external_node_modules = ["@supabase/supabase-js"]

[functions."ingest-news"]
  schedule = "@daily"

[functions."ingest-directory"]
  schedule = "@weekly"

[functions."recheck-scholarships"]
  schedule = "@monthly"

[functions."recheck-reference"]
  schedule = "0 0 1 */3 *"     # quarterly: Jan 1, Apr 1, Jul 1, Oct 1 — "@quarterly" is not valid Netlify syntax
