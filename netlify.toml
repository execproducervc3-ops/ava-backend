[build]
  functions = "netlify/functions"
  publish = "public"

# mcp-server.js is a CommonJS (v1) function, which doesn't support the
# export const config = { path } mechanism the earlier .mjs version used —
# this redirect provides the same clean /mcp URL instead.
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp-server"
  status = 200
  force = true

[functions]
  node_bundler = "esbuild"
  # supabase-js was kept as a harmless safety net from an earlier fix attempt.
  # @resvg/resvg-js is needed for the share preview pictures: it contains a
  # compiled native part that can't be bundled, so it must stay external.
  external_node_modules = ["@supabase/supabase-js", "@resvg/resvg-js"]
  # Fonts used to draw the share preview pictures.
  included_files = ["netlify/functions/fonts/**"]

[functions."ingest-news"]
  schedule = "@daily"

[functions."ingest-directory"]
  schedule = "@weekly"

[functions."ingest-points-of-interest"]
  schedule = "@weekly"

[functions."recheck-scholarships"]
  schedule = "@monthly"

[functions."recheck-reference"]
  schedule = "0 0 1 */3 *"     # quarterly: Jan 1, Apr 1, Jul 1, Oct 1 — "@quarterly" is not valid Netlify syntax

# recheck-fuel-prices.js is NOT scheduled here — it appears to be leftover
# code from the FRED/EIA fuel-tracking approach that was explicitly
# abandoned in favor of pulling fuel context from the existing news RSS
# feed instead.

[functions."agent-gap-research"]
  schedule = "@daily"

[functions."agent-data-quality"]
  schedule = "@weekly"

[functions."photo-finder"]
  schedule = "@daily"

[functions."source-watch"]
  schedule = "0 */3 * * *"

[functions."admin-landmarks"]
  timeout = 26

# Drafting an entry from a watched page asks the AI, which can take longer than the default 10 seconds.
[functions."admin-publish-entry"]
  timeout = 26

# Shared answers and listings (public pages)
[[redirects]]
  from = "/a/:id"
  to = "/.netlify/functions/share-page?kind=a&id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/l/:id"
  to = "/.netlify/functions/share-page?kind=l&id=:id"
  status = 200
  force = true

# Preview pictures for shared links
[[redirects]]
  from = "/og/a/:id"
  to = "/.netlify/functions/share-image?kind=a&id=:id"
  status = 200

[[redirects]]
  from = "/og/l/:id"
  to = "/.netlify/functions/share-image?kind=l&id=:id"
  status = 200

# AVA Jobs: the customer's private job page (the page reads the token from its address)
[[redirects]]
  from = "/job/:token"
  to = "/job/index.html"
  status = 200
  force = true

[functions."ingest-news-regional"]
  schedule = "0 */3 * * *"
