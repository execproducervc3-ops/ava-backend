<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My job | AVA</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#15181A;--panel:#1E2224;--line:#33383B;--ink:#EDEAE3;--soft:#9C978A;--teal:#3FA3A3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.wrap{max-width:520px;margin:0 auto}header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
header b{font-size:17px}header span{margin-left:auto;color:var(--soft);font-size:14px}
main{padding:24px 20px 48px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:26px;line-height:1.2}p{margin:0;line-height:1.5}.soft{color:var(--soft);font-size:13px;line-height:1.4}
label.l{display:block;font-size:13px;color:var(--soft);margin-bottom:6px}
input[type=text],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:0 14px;font:inherit;font-size:16px;height:48px}
textarea{height:104px;padding:12px 14px;resize:none;line-height:1.4}
.row{display:flex;gap:12px}.row>div{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.photos{display:flex;gap:10px}.slot{flex:1;aspect-ratio:1/1;border:1px dashed var(--line);border-radius:10px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;overflow:hidden;position:relative}
.slot img{width:100%;height:100%;object-fit:cover}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--soft)}.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--teal)}
button.go{height:52px;border-radius:26px;border:0;background:var(--teal);color:var(--bg);font:inherit;font-size:17px;font-weight:700;cursor:pointer}
button.go:disabled{opacity:.5}.err{color:#F0846B;font-size:14px;min-height:20px}
.pill{display:inline-block;font-size:12px;font-weight:600;color:var(--bg);background:var(--teal);border-radius:10px;padding:3px 10px}
</style></head><body><div class="wrap"><header><svg viewBox="180 100 320 440" width="29" height="40" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M 325 420 Q 315 470 330 510 Q 340 475 335 420 Z" fill="#D9541F"/><path d="M 300 418 Q 280 460 295 495 Q 312 465 318 420 Z" fill="#2D6E8E"/><path d="M 355 418 Q 375 460 360 495 Q 343 465 337 420 Z" fill="#E8A317"/><ellipse cx="340" cy="330" rx="100" ry="120" fill="#E8A317"/><path d="M 250 295 Q 222 330 232 375 Q 250 395 283 385 Q 258 340 250 295 Z" fill="#6B8E23"/><path d="M 255 350 Q 240 365 246 380 Q 262 388 278 380 Q 262 368 255 350 Z" fill="#2D6E8E"/><path d="M 430 295 Q 458 330 448 375 Q 430 395 397 385 Q 422 340 430 295 Z" fill="#6B8E23"/><path d="M 425 350 Q 440 365 434 380 Q 418 388 402 380 Q 418 368 425 350 Z" fill="#2D6E8E"/><circle cx="340" cy="205" r="68" fill="#7C9A3D"/><path d="M 318 212 Q 340 206 362 212 Q 360 232 340 252 Q 320 232 318 212 Z" fill="#4A3728"/><path d="M 328 222 Q 340 218 352 222 Q 350 234 340 244 Q 330 234 328 222 Z" fill="#2B2116" opacity="0.5"/><circle cx="312" cy="195" r="10" fill="#FBF3E7"/><circle cx="313" cy="196" r="6" fill="#2B2116"/><circle cx="315" cy="193" r="1.8" fill="#FBF3E7"/><circle cx="368" cy="195" r="10" fill="#FBF3E7"/><circle cx="369" cy="196" r="6" fill="#2B2116"/><circle cx="371" cy="193" r="1.8" fill="#FBF3E7"/><path d="M 310 435 Q 305 448 298 456" stroke="#5A4632" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M 370 435 Q 375 448 382 456" stroke="#5A4632" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M 250 458 Q 340 446 430 458" stroke="#5A4632" stroke-width="7" fill="none" stroke-linecap="round"/></svg><b>AVA</b><span>My job</span></header>
<main id="m"><p class="soft">Loading…</p></main></div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=location.pathname.split('/').filter(Boolean)[1]||'';
const CAT={trucking:'Trucking service',taxi:'Taxi service'};
fetch('/.netlify/functions/job-view?token='+encodeURIComponent(token)).then(r=>r.ok?r.json():Promise.reject()).then(({job,quote_count})=>{
 const open=job.status==='open';
 const when=job.expires_at?Math.max(0,Math.ceil((new Date(job.expires_at)-Date.now())/86400000)):0;
 const label={pending:'Waiting for AVA to check it',open:'Open',closed:'Closed',accepted:'Quote chosen',reported:'Under review',done:'Done'}[job.status]||job.status;
 document.getElementById('m').innerHTML=
  '<div class="card"><div><span class="pill">'+esc(label)+'</span> <span class="soft">'+esc(CAT[job.category]||'')+' · '+esc(job.island)+'</span></div>'
  +'<div style="font-size:18px;font-weight:600;line-height:1.3">'+esc(job.description)+'</div>'
  +'<div class="soft" style="font-size:14px">'+esc([job.from_place&&job.to_place?job.from_place+' to '+job.to_place:'',job.when_text].filter(Boolean).join(' · '))+'</div>'
  +(job.photos&&job.photos.length?'<div class="photos">'+job.photos.map(u=>'<div class="slot" style="cursor:default"><img src="'+esc(u)+'" alt="Job photo"></div>').join('')+'</div>':'')+'</div>'
  +(open?'<div><h1 style="font-size:22px">'+quote_count+' of '+job.max_quotes+' quotes</h1><p class="soft" style="margin-top:4px">This job takes quotes for '+when+' more day'+(when===1?'':'s')+', or until it has '+job.max_quotes+'. Quotes will appear here.</p></div>':'')
  +'<p class="soft">AVA introduces customers and providers and does not handle payment. Keep this link private: anyone with it can see this page.</p>';
}).catch(()=>{document.getElementById('m').innerHTML='<h1>This job is not available</h1><p class="soft">It may have been completed and deleted, or the link is wrong.</p>'});
</script></body></html>
