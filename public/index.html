<style>
  :root{
    --teal:#1B5E5E; --teal-dark:#123F3F; --teal-soft:#E4EEEE;
    --coral:#D9541F; --coral-soft:#FBE4D6;
    --gold:#E8A317; --gold-soft:#FBEBC9;
    --cream:#FFFFFF; --card:#FFFFFF;
    --ink:#2B2116; --soft:#786A57; --line:#E7DFCE;
    --flag-blue:#0072C6; --flag-gold:#FCD116; --flag-green:#009E60;
    --shadow:0 2px 14px rgba(43,33,22,0.07);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;display:flex;flex-direction:column;}
  .disp{font-family:'Fraunces',serif;}

  header{
    background:var(--cream);color:var(--ink);padding:12px 20px;
    display:flex;align-items:center;gap:12px;flex:0 0 auto;
    border-bottom:1px solid var(--line);position:relative;z-index:2;
  }
  header .mascot{width:52px;height:52px;}
  header .word{font-family:'Inter',sans-serif;font-weight:700;font-size:30px;letter-spacing:-0.01em;}
  header .word .l1{color:var(--flag-blue);}
  header .word .l2{color:var(--flag-gold);}
  header .word .l3{color:var(--flag-green);}
  .mascot{flex:0 0 auto;overflow:visible;}
  .logo-btn{
    display:flex;align-items:center;gap:12px;background:none;border:none;padding:2px;margin:-2px;
    cursor:pointer;border-radius:8px;text-align:left;
  }
  .logo-btn:hover{background:var(--teal-soft);}

  body.home header, body.home main, body.home footer, body.home .foot-note{display:none;}
  body.results #homeHero{display:none;}

  #homeHero{
    flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:24px 16px 80px;text-align:center;
  }
  .hero-wordmark{
    font-family:'Inter',sans-serif;font-weight:700;letter-spacing:-0.01em;
    font-size:clamp(28px,6vw,52px);display:flex;align-items:center;gap:.35em;flex-wrap:wrap;justify-content:center;
  }
  .hero-wordmark .w-ask{color:var(--flag-blue);}
  .hero-wordmark .w-vincy{color:var(--flag-gold);}
  .hero-wordmark .w-any{color:var(--flag-green);}
  .hero-wordmark .w-pipe{color:var(--line);font-weight:400;}
  .hero-mascot{width:clamp(90px,14vw,150px);height:auto;}

  .hero-searchwrap{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;}
  .hero-searchbar{
    display:flex;align-items:center;gap:10px;width:100%;max-width:584px;
    border:1px solid var(--line);border-radius:24px;padding:12px 20px;
    box-shadow:0 1px 6px rgba(43,33,22,0.1);transition:box-shadow .15s;
  }
  .hero-searchbar:focus-within{box-shadow:0 2px 12px rgba(43,33,22,0.18);}
  .hero-searchbar .search-icon{opacity:.55;font-size:15px;}
  .hero-searchbar input{flex:1;border:none;outline:none;background:transparent;font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);}
  .hero-searchbar input::placeholder{color:var(--soft);}
  .hero-buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .gbtn{
    font-family:'Inter',sans-serif;font-size:13.5px;padding:9px 18px;border-radius:5px;
    background:var(--teal-soft);border:1px solid transparent;color:var(--ink);cursor:pointer;
  }
  .gbtn:hover{border-color:var(--line);box-shadow:0 1px 3px rgba(43,33,22,0.12);}
  .m-eye{animation-timing-function:ease-in-out;}
  .m-eye.blink{animation:eyeBlink 0.32s ease-in-out;}
  @keyframes eyeBlink{0%,100%{transform:scaleY(1);}45%{transform:scaleY(0.12);}}
  .m-head.tilt{animation:headTilt 0.9s ease-in-out;}
  @keyframes headTilt{0%{transform:rotate(0deg);}35%{transform:rotate(9deg);}70%{transform:rotate(-3deg);}100%{transform:rotate(0deg);}}
  .m-wing-l.flutter{animation:wingFlutterL 0.6s ease-in-out;}
  .m-wing-r.flutter{animation:wingFlutterR 0.6s ease-in-out;}
  @keyframes wingFlutterL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-10deg);}}
  @keyframes wingFlutterR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(10deg);}}
  .m-bob.bob{animation:bodyBob 0.8s ease-in-out;}
  @keyframes bodyBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  @media (prefers-reduced-motion: reduce){
    .m-eye.blink,.m-head.tilt,.m-wing-l.flutter,.m-wing-r.flutter,.m-bob.bob{animation:none;}
  }

  main{flex:1 1 auto;overflow-y:auto;display:flex;justify-content:center;}
  .thread{width:100%;max-width:720px;padding:20px 16px 10px;display:flex;flex-direction:column;gap:14px;}

  .intro{text-align:center;padding:26px 10px 6px;}
  .intro .disp{font-size:26px;font-weight:600;color:var(--teal-dark);margin-bottom:6px;}
  .intro p{color:var(--soft);font-size:13.5px;max-width:420px;margin:0 auto 18px;line-height:1.5;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .chip{
    font-family:'Inter',sans-serif;font-size:12.5px;padding:9px 14px;border-radius:20px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
  }
  .chip:hover{border-color:var(--coral);color:var(--coral);}

  .msg{display:flex;gap:10px;max-width:100%;}
  .msg.user{justify-content:flex-end;}
  .msg .avatar{width:30px;height:30px;border-radius:50%;background:var(--teal-soft);flex:0 0 auto;object-fit:contain;padding:3px;}
  .bubble{padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.55;max-width:78%;overflow-wrap:break-word;word-break:break-word;}
  .msg.ava .bubble{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px;box-shadow:var(--shadow);}
  .msg.user .bubble{background:var(--teal);color:#fff;border-top-right-radius:4px;}
  .inlinelink{color:var(--teal);font-weight:600;text-decoration:underline;}
  .msg.user .inlinelink{color:#fff;}
  .bubble p{margin:0 0 8px;}
  .bubble p:last-child{margin-bottom:0;}

  .linkcard{
    margin-top:8px;display:block;text-decoration:none;
    background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;
    padding:11px 13px;color:var(--ink);
  }
  .linkcard .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin-bottom:3px;}
  .linkcard .name{font-weight:600;font-size:13.5px;}
  .linkcard .arrow{float:right;color:var(--coral);}

  .pricecard{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .pricecard-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);padding:9px 12px 6px;}
  .pricegroup{border-top:1px solid var(--line);}
  .pricegroup:first-child{border-top:none;}
  .pricegroupname{font-size:11px;font-weight:700;text-transform:capitalize;color:var(--ink);padding:8px 12px 2px;}
  .pricenotfound{font-size:11.5px;color:var(--soft);padding:2px 12px 10px;}
  .pricerow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);}
  .pricethumb{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:var(--teal-soft);}
  .pricethumb.placeholder{display:flex;align-items:center;justify-content:center;font-size:15px;}
  .pricemain{flex:1;min-width:0;}
  .pricename{font-size:12px;font-weight:600;}
  .cheapest{background:var(--flag-green);color:#fff;font-size:9px;padding:1px 6px;border-radius:8px;text-transform:uppercase;letter-spacing:.03em;}
  .priceisland{color:var(--soft);font-weight:400;}
  .priceitem{font-size:11.5px;color:var(--soft);}
  .pricenormalized{font-size:11px;color:var(--teal);font-weight:600;margin-top:2px;}
  .priceval{font-weight:700;font-size:13.5px;flex:0 0 auto;text-align:right;}
  .priceunit{font-weight:400;font-size:10px;color:var(--soft);}
  .pricecontact{font-size:10.5px;color:var(--soft);margin-top:3px;}
  .pricephone{color:var(--teal);text-decoration:none;font-weight:600;}
  .pricephone:hover{text-decoration:underline;}

  .newscard{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .newscard-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);padding:9px 12px 6px;}
  .newsrow{padding:9px 12px;border-top:1px solid var(--line);}
  .newstopic{font-size:12.5px;font-weight:600;margin-bottom:3px;}
  .newsbody{font-size:12px;color:var(--ink);line-height:1.5;margin-bottom:5px;}
  .newsmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .newsdate{font-size:10.5px;color:var(--soft);}
  .newslink{font-size:11px;color:var(--teal);text-decoration:none;font-weight:600;white-space:nowrap;}
  .newslink:hover{text-decoration:underline;}

  .ferrycard{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .ferrycard-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);padding:9px 12px 6px;}
  .ferryrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);}
  .ferrytime{font-weight:700;font-size:14px;color:var(--teal);flex:0 0 auto;min-width:44px;}
  .ferrymain{flex:1;min-width:0;}
  .ferryroute{font-size:12.5px;font-weight:600;}
  .ferryoperator{font-size:11px;color:var(--soft);}
  .ferryfare{font-weight:700;font-size:12.5px;flex:0 0 auto;}

  .luckycard{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;}
  .luckycard-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin-bottom:9px;}
  .luckyballs{display:flex;flex-wrap:wrap;gap:8px;}
  .luckyball{
    width:38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
    position:relative;flex:0 0 auto;
  }
  .luckyball.luckybonus{background:var(--gold);}
  .luckyball.luckyletter{background:var(--coral);}
  .luckyball.luckywide{width:auto;min-width:52px;border-radius:10px;padding:0 10px;flex-direction:column;height:44px;background:var(--teal);}
  .luckyballlbl{font-size:8px;text-transform:uppercase;opacity:.85;line-height:1;margin-bottom:1px;}

  .dircard{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .dircard-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);padding:9px 12px 6px;}
  .dirrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);}
  .dirmain{flex:1;min-width:0;}
  .dirname{font-size:12.5px;font-weight:600;}
  .dirmeta{font-size:11px;color:var(--soft);}
  .dirphone{flex:0 0 auto;font-size:16px;text-decoration:none;}

  .thinking{display:flex;gap:4px;padding:6px 0;}
  .thinking span{width:6px;height:6px;border-radius:50%;background:var(--soft);animation:bounce 1.2s infinite ease-in-out;}
  .thinking span:nth-child(2){animation-delay:.15s;}
  .thinking span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{opacity:.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}

  .searchnote{font-size:11px;color:var(--soft);display:flex;align-items:center;gap:5px;margin:2px 0 4px 40px;}

  footer{flex:0 0 auto;padding:12px 16px 16px;display:flex;justify-content:center;background:var(--cream);}
  .composer{width:100%;max-width:720px;display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:6px 6px 6px 18px;box-shadow:var(--shadow);}
  .composer input{flex:1;border:none;background:transparent;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);outline:none;padding:8px 0;}
  .composer input::placeholder{color:var(--soft);}
  .composer button{
    width:38px;height:38px;border-radius:50%;border:none;background:var(--coral);color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  }
  .composer button:disabled{opacity:.5;cursor:default;}
  .foot-note{text-align:center;font-size:10.5px;color:var(--soft);max-width:720px;margin:8px auto 0;}
</style>
</head>

<style>
  .sponsor-card{
    width:100%; max-width:560px; margin:16px auto 0; background:#fff;
    border:1px solid var(--gold); border-radius:14px; padding:12px 16px;

  .sponsor-eyebrow{

  .sponsor-photo{

  .sponsor-main{flex:1; min-width:0;}

  @media (max-width:480px){
    .sponsor-body{flex-wrap:wrap;}
    .sponsor-ctawrap{width:100%; flex-direction:row; justify-content:center;}
    .sponsor-cta{flex:1;}
  }
</style>

const LS_PREFIX = 'ava-app:';
const memoryStore = {};
const storageShim = {
  async get(key){
    if(storageAvailable) return window.storage.get(key, false);
    if(localStorageAvailable){ const raw = localStorage.getItem(LS_PREFIX+key); return raw!==null ? {value:raw} : null; }
    return memoryStore[key] ? {value: memoryStore[key]} : null;
  },
  async set(key, value){
    if(storageAvailable) return window.storage.set(key, value, false);

    memoryStore[key] = value;

function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function renderMarkdownish(text){
  // Extract markdown links [label](url) into placeholder tokens BEFORE escaping,
  // so URL characters (like & in query strings) aren't corrupted, and so the
  // brackets/parens don't get caught up in general escaping either.
  const links = [];
  const withPlaceholders = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (match, label, url) => {
    const token = `\u0000LINK${links.length}\u0000`;
    links.push({ label, url });
    return token;
  });

  const esc = escapeHtml(withPlaceholders);
  const withBold = esc.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  let html = withBold.split(/\n\n+/).map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');

  // Substitute real, safely-escaped anchor tags back in for each placeholder
  links.forEach((link, i) => {
    const token = `\u0000LINK${i}\u0000`;
    const anchor = `<a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" class="inlinelink">${escapeHtml(link.label)}</a>`;
    html = html.split(token).join(anchor);
  });

  return html;
}

function renderDirectoryResults(results){
  const rows = results.map(d => `
    <div class="dirrow">
      <div class="dirmain">
        <div class="dirname">${escapeHtml(d.name)}</div>
        <div class="dirmeta">${[d.island, d.address].filter(Boolean).map(escapeHtml).join(' &middot; ')}</div>
      </div>
      ${d.phone ? `<a href="tel:${escapeHtml(String(d.phone).replace(/[^\d+]/g,''))}" class="dirphone">&#128222;</a>` : ''}
    </div>`).join('');
  return `<div class="dircard"><div class="dircard-lbl">From AVA's directory</div>${rows}</div>`;
}

function renderLuckyNumbers(lucky){
  let ballsHtml = '';
  if(lucky.game === '3D'){
    ballsHtml = [lucky.bigD, lucky.midD, lucky.littleD].map((v, i) =>
      `<div class="luckyball luckywide"><span class="luckyballlbl">${['Big-D','Mid-D','Little-D'][i]}</span>${escapeHtml(v)}</div>`).join('');
  } else if(lucky.game === 'Play 4'){
    ballsHtml = lucky.digits.map(d => `<div class="luckyball">${d}</div>`).join('');
  } else {
    ballsHtml = lucky.numbers.map(n => `<div class="luckyball">${n}</div>`).join('');
    if(lucky.bonusBall !== undefined) ballsHtml += `<div class="luckyball luckybonus"><span class="luckyballlbl">BB</span>${lucky.bonusBall}</div>`;
    if(lucky.bonusLetter) ballsHtml += `<div class="luckyball luckyletter">${escapeHtml(lucky.bonusLetter)}</div>`;
  }
  return `<div class="luckycard">
    <div class="luckycard-lbl">${escapeHtml(lucky.game)} — for fun only, not a real draw result</div>
    <div class="luckyballs">${ballsHtml}</div>
  </div>`;
}

function renderFerryResults(results){
  const rows = results.map(s => `
    <div class="ferryrow">
      <div class="ferrytime">${escapeHtml(String(s.departure_time).slice(0,5))}</div>
      <div class="ferrymain">
        <div class="ferryroute">${escapeHtml(s.origin)} &#8594; ${escapeHtml(s.destination)}</div>
        <div class="ferryoperator">${escapeHtml(s.operator)}</div>
      </div>
      ${s.fare_economy ? `<div class="ferryfare">$${Number(s.fare_economy).toFixed(0)} EC</div>` : ''}
    </div>`).join('');
  return `<div class="ferrycard"><div class="ferrycard-lbl">Ferry sailings &mdash; confirm before travel</div>${rows}</div>`;
}

function renderNewsResults(results){
  const rows = results.map(a => {
    const dateStr = a.published_at ? new Date(a.published_at).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) : '';
    return `
    <div class="newsrow">
      <div class="newstopic">${escapeHtml(a.topic)}</div>
      <div class="newsbody">${escapeHtml(a.body)}</div>
      <div class="newsmeta">
        ${dateStr ? `<span class="newsdate">${dateStr}</span>` : ''}
        ${a.source_url ? `<a href="${escapeHtml(a.source_url)}" target="_blank" rel="noopener noreferrer" class="newslink">Read full article &#8599;</a>` : ''}
      </div>
    </div>`;
  }).join('');
  return `<div class="newscard"><div class="newscard-lbl">From AVA's news database</div>${rows}</div>`;
}

function renderRetailResults(groups){
  const sections = groups.map(g => {
    if(!g.results || !g.results.length){
      return `<div class="pricegroup">
        <div class="pricegroupname">${escapeHtml(g.product)}</div>
        <div class="pricenotfound">${escapeHtml(g.note || 'No results found.')}</div>
      </div>`;
    }
    const rows = g.results.map((r, i) => {
      const loc = [r.parish, r.island].filter(Boolean).join(', ');
      const contactBits = [];
      if(loc || r.address) contactBits.push(`&#128205; ${escapeHtml([r.address, loc].filter(Boolean).join(', '))}`);
      if(r.phone) contactBits.push(`<a href="tel:${escapeHtml(r.phone.replace(/[^\d+]/g,''))}" class="pricephone">&#128222; ${escapeHtml(r.phone)}</a>`);
      const normalizedLine = r.price_per_standard_unit
        ? `<div class="pricenormalized">&asymp; $${Number(r.price_per_standard_unit).toFixed(2)} / ${r.standard_unit_type === 'weight_lb' ? 'lb' : 'gallon'}</div>`
        : '';
      return `
      <div class="pricerow">
        ${r.photo_url ? `<img class="pricethumb" src="${r.photo_url}" alt="">` : `<div class="pricethumb placeholder">&#128717;</div>`}
        <div class="pricemain">
          <div class="pricename">${i === 0 ? '<span class="cheapest">Cheapest</span> ' : ''}${escapeHtml(r.retailer)}</div>
          <div class="priceitem">${escapeHtml(r.item_name)}</div>
          ${normalizedLine}
          ${contactBits.length ? `<div class="pricecontact">${contactBits.join(' &nbsp;·&nbsp; ')}</div>` : ''}
        </div>
        <div class="priceval">$${Number(r.price).toFixed(2)}${r.unit ? `<span class="priceunit">/${escapeHtml(r.unit)}</span>` : ''}</div>
      </div>`;
    }).join('');
    return `<div class="pricegroup">
      <div class="pricegroupname">${escapeHtml(g.product)}</div>
      ${rows}
    </div>`;
  }).join('');
  const label = groups.length > 1 ? `Real prices from AVA retailers &mdash; ${groups.length} items` : 'Real prices from AVA retailers';
  return `<div class="pricecard"><div class="pricecard-lbl">${label}</div>${sections}</div>`;
}

function renderLinkCard(card){
  return `<a class="linkcard" href="${card.url}" target="_blank" rel="noopener">
    <div class="lbl">${escapeHtml(card.label)}</div>
    <div class="name">${escapeHtml(card.name)} <span class="arrow">&#8594;</span></div>
  </a>`;
}

// Ambient palm frond decoration — regenerates with random variation on a
// slow interval, fading out and back in rather than cutting abruptly.
function buildFrondCluster(cx, cy, scale, color, flip){
  const s = flip ? -1 : 1;
  // Randomized angle spread and blade count each time this is called, so
  // every regeneration looks like a genuinely different frond, not a repeat.
  const bladeCount = 6 + Math.floor(Math.random() * 2); // 6 or 7 blades
  const spread = 150 + Math.random() * 30; // total degrees the fan covers
  const startAngle = -spread / 2 + (Math.random() * 10 - 5);
  let paths = '';
  for(let i = 0; i < bladeCount; i++){
    const a = startAngle + (spread / (bladeCount - 1)) * i;
    const rad = a * Math.PI / 180;
    const lengthVariance = 0.85 + Math.random() * 0.3;
    const length = scale * (Math.abs(a) < 20 ? 1.0 : 0.85) * lengthVariance;
    const tipX = cx + s * Math.sin(rad) * length;
    const tipY = cy - Math.cos(rad) * length;
    const perpX = Math.cos(rad) * scale * (0.07 + Math.random() * 0.04);
    const perpY = Math.sin(rad) * scale * (0.07 + Math.random() * 0.04);
    const midX = cx + s * Math.sin(rad) * length * 0.5;
    const midY = cy - Math.cos(rad) * length * 0.5;
    const c1x = midX + s * perpX, c1y = midY + perpY;
    const c2x = midX - s * perpX, c2y = midY - perpY;
    paths += `<path d="M ${cx.toFixed(1)} ${cy.toFixed(1)} Q ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${tipX.toFixed(1)} ${tipY.toFixed(1)} Q ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)} Z" fill="${color}"/>`;
  }
  paths += `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${(cy + scale * 0.9).toFixed(1)}" stroke="${color}" stroke-width="${(scale * 0.04).toFixed(1)}" stroke-linecap="round"/>`;
  return paths;
}

function generatePalmSide(flip){
  const jitter = () => Math.random() * 20 - 10;
  const colors = ['#C5D4A8', '#8FAA5C', '#5E7D3A'];
  // Spread clusters across the full page height, not just the top —
  // percentages of the 0-500 viewBox so they distribute the whole length.
  const positions = [0.06, 0.28, 0.5, 0.72, 0.92];
  let out = '';
  positions.forEach((pct, i) => {
    const baseX = flip ? 260 : 0;
    const x = baseX + (flip ? 1 : -1) * (10 + Math.random() * 20) + jitter();
    const y = pct * 500 + jitter();
    const scale = 110 + Math.random() * 60;
    const color = colors[i % colors.length];
    out += buildFrondCluster(x, y, scale, color, flip);
  });
  return out;
}

function refreshPalmDecoration(){
  const left = document.getElementById('palmLeft');
  const right = document.getElementById('palmRight');
  if(!left || !right) return;

  left.classList.add('palm-fade');
  right.classList.add('palm-fade');

  setTimeout(() => {
    left.innerHTML = generatePalmSide(false);
    right.innerHTML = generatePalmSide(true);
    left.classList.remove('palm-fade');
    right.classList.remove('palm-fade');
  }, 1800); // matches the restored CSS transition duration below
}

// Initial render, then the original slower, ambient regeneration cycle.
refreshPalmDecoration();
setInterval(refreshPalmDecoration, 14000);

// Anonymous device identifier — generated once per browser, never tied to a
// name or account. Used only to distinguish repeat visits from genuinely
// distinct visitors in aggregate product-interest reporting.
function getDeviceId(){
  let id = localStorage.getItem('ava_device_id');
  if(!id){
    id = crypto.randomUUID();
    localStorage.setItem('ava_device_id', id);
  }
  return id;
}

function setSending(state){
  document.getElementById('sendBtn').disabled = state;
  document.getElementById('input').disabled = state;
}

async function saveHistory(){
  try{ await storageShim.set('chat-history', JSON.stringify(history.slice(-40))); } catch(e){}
}
async function loadHistory(){
  try{
    const res = await storageShim.get('chat-history');
    if(res && res.value){
      history = JSON.parse(res.value);
      if(history.length){
        enterResultsMode();
        history.forEach(m => {
          const text = typeof m.content === 'string' ? m.content : (m.content||[]).map(b=>b.text||'').join(' ');
          if(text) appendMessage(m.role === 'user' ? 'user' : 'ava', text);
        });
      }
    }
  } catch(e){}
}

document.getElementById('sendBtn').addEventListener('click', () => {
  const input = document.getElementById('input');
  const text = input.value;
  input.value = '';
  handleSend(text);
});
document.getElementById('input').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    const text = e.target.value;
    e.target.value = '';
    handleSend(text);
  }
});
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => handleSend(chip.dataset.q));
});

const STARTER_QUESTIONS = [
  'What time does the Bequia ferry leave today?',
  'What are some good beaches or restaurants near Kingstown?',
  'How do I get a UK ETA as a Vincentian?',
  'I want to fly from New York to Argyle International Airport next month, help me find flights',
  "What's happening in SVG this weekend?",
  'What should I pack for a trip to the Grenadines?',
];

function enterResultsMode(){
  document.body.classList.remove('home');
  document.body.classList.add('results');
}

async function loadSponsor(){
  try{
    const res = await fetch('/.netlify/functions/get-sponsor');
    const data = await res.json();
    const slot = document.getElementById('sponsorSlot');
    if(!data.sponsor){ slot.innerHTML = ''; return; }
    const s = data.sponsor;
    const photoHtml = s.photoUrl
      ? `<img src="${escapeHtml(s.photoUrl)}" alt="">`
      : `<svg viewBox="0 0 56 56" width="56" height="56"><rect width="56" height="56" fill="#E4EDF1"/><path d="M14 38 L23 26 L30 34 L36 27 L44 38 Z" fill="#B9CDD6"/><circle cx="20" cy="19" r="4.5" fill="#B9CDD6"/></svg>`;
    slot.innerHTML = `
      <div class="sponsor-card">
        <div class="sponsor-eyebrow">Sponsored</div>
        <div class="sponsor-body">
          <div class="sponsor-photo">${photoHtml}</div>
          <div class="sponsor-main">
            <div class="sponsor-name">${escapeHtml(s.name)}</div>
            <div class="sponsor-blurb">${escapeHtml(s.blurb || '')}${s.blurb && s.location ? ' — ' : ''}${escapeHtml(s.location || '')}</div>
          </div>
          <div class="sponsor-ctawrap">
            <div class="sponsor-icon">&#127869;</div>
            ${s.targetUrl ? `<a href="${escapeHtml(s.targetUrl)}" target="_blank" rel="noopener noreferrer" class="sponsor-cta">View menu</a>` : ''}
          </div>
        </div>
      </div>`;
  } catch(e){
    // A broken sponsor fetch should never break the homepage — just show nothing.
    const slot = document.getElementById('sponsorSlot');
    if(slot) slot.innerHTML = '';
  }
}
loadSponsor();

function submitFromHero(customText){
  const input = document.getElementById('heroInput');
  const text = customText !== undefined ? customText : input.value;
  if(!text || !text.trim()) return;
  input.value = '';
  enterResultsMode();
  handleSend(text);
}

document.getElementById('heroAskBtn').addEventListener('click', () => submitFromHero());
document.getElementById('heroInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') submitFromHero();
});
document.getElementById('heroSurpriseBtn').addEventListener('click', () => {
  submitFromHero(STARTER_QUESTIONS[Math.floor(Math.random() * STARTER_QUESTIONS.length)]);
});

async function startNewChat(){

document.getElementById('newChatBtn').addEventListener('click', startNewChat);
document.getElementById('headerLogo').addEventListener('click', startNewChat);

// Idle mascot animation — random blink / tilt / flutter / bob, on no fixed schedule
(function mascotIdle(){
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion) return;
  const head = document.querySelector('.m-head');
  const eyes = document.querySelectorAll('.m-eye');
  const wingL = document.querySelector('.m-wing-l');
  const wingR = document.querySelector('.m-wing-r');
  const body = document.querySelector('.m-bob');
  if(!head || !body) return;

  function play(el, cls){
    if(!el) return;
    el.classList.remove(cls); void el.offsetWidth; // force reflow so the animation can retrigger
    el.classList.add(cls);
    el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
  }

  const moves = [
    () => eyes.forEach(e => play(e, 'blink')),
    () => play(head, 'tilt'),
    () => { play(wingL, 'flutter'); play(wingR, 'flutter'); },
    () => play(body, 'bob'),
    () => { eyes.forEach(e => play(e, 'blink')); play(head, 'tilt'); }, // occasional combo
  ];

  function scheduleNext(){
    const delay = 2200 + Math.random() * 4500;
    setTimeout(() => {
      moves[Math.floor(Math.random() * moves.length)]();
      scheduleNext();
    }, delay);
  }
  scheduleNext();
})();
</script>
